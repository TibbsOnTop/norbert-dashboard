name: Sync Notion data

on:
  schedule:
    # Mon 01:00 UTC ≈ Sunday evening in US time zones
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "norbert-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/data.json; then
            echo "No changes to data/data.json"
          else
            git add data/data.json
            git commit -m "Sync Notion data ($(date -u +%Y-%m-%d))"
            git push
          fi
